# Configuración de Railway para el servicio backend de QA Forge.
# El root del repo se monta en /app; el Dockerfile vive en backend/Dockerfile
# pero su build context es la raíz (necesita copiar shared/ además de backend/).

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
# Railway corre startCommand en exec form (sin shell), así que `&&` no se
# interpreta. Separamos: la migración va en preDeployCommand, el server en
# startCommand. preDeployCommand sí corre en shell.
preDeployCommand = "bunx prisma db push --schema=src/db/schema.prisma --accept-data-loss --skip-generate"
startCommand = "bun src/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
